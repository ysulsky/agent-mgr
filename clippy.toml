# With serde_json's preserve_order, Map::remove is swap_remove: it moves the last key into
# the removed one's place, so a rewritten record's keys come out in a different order. Records
# keep their key order: use shift_remove.
disallowed-methods = [
    { path = "serde_json::Map::remove", reason = "reorders keys under preserve_order; use shift_remove, which keeps the order" },
    { path = "serde_json::Map::remove_entry", reason = "reorders keys under preserve_order; use shift_remove_entry" },
]
